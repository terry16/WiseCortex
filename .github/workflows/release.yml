name: Release

# 打 tag 触发（如 v0.9.19），产出三平台安装包并挂到 GitHub Release。
# 手动触发（workflow_dispatch）用于补发或试跑。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.9.19)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          # Intel 版：macos-13 已进入退役流程（排队几乎不再被调度），
          # 官方替代标签是 macos-15-intel，供应到 2027-08，之后 Actions 不再提供 x86_64。
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64

    runs-on: ${{ matrix.os }}
    # secrets 上下文在 step 级 if 里取不到，提到 job 级 env 才能拿来做条件判断。
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端先构建：Tauri 打包时直接吃 web/dist。
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      # CLI + server 独立二进制（不带 GUI，服务器/终端用户装这个）。
      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} -p wisecortex-cli -p wisecortex-server

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # macOS 代码签名：把 Developer ID 证书导入临时钥匙串。
      # Secrets 缺失时整步跳过 —— 外部贡献者 fork 后 CI 依然能跑，只是产物未签名。
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          # 允许 codesign 无提示访问私钥（CI 无人值守，弹窗即挂）
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f $RUNNER_TEMP/cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      # 公证用的 App Store Connect API Key：Tauri 通过 APPLE_API_KEY_PATH 读取。
      - name: Write notarization API key (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY_ID != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p $RUNNER_TEMP/private_keys
          echo "$APPLE_API_KEY_P8" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> $GITHUB_ENV

      # 桌面安装包：Windows 出 .msi/.exe，macOS 出 .dmg/.app。
      # macOS 上若提供了签名/公证凭据，Tauri 会在打包过程中直接签名并送公证。
      - name: Build desktop bundle
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx tauri build --target ${{ matrix.target }}

      # Tauri 只公证 .app，dmg 是 .app 公证完之后才打的，因此 dmg 自身没有公证记录
      # （直接 staple 会 "Record not found"）。这里把 dmg 单独送一次公证再装订：
      # 用户下载的是 dmg，装订后首次打开无需联网校验。
      - name: Notarize and staple DMG (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY_ID != ''
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$f" --wait --timeout 30m \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER"
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
            # 装订生效的判据：source 必须是 "Notarized Developer ID"。
            spctl -a -vvv -t install "$f" 2>&1 | tee /tmp/spctl.txt
            grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          done

      # 打包裸二进制，方便不想装 GUI 的用户直接取用。
      - name: Package binaries (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/dist/wisecortex-${{ matrix.label }}.tar.gz" wisecortex wisecortex-server
      - name: Package binaries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/wisecortex.exe,
                                 target/${{ matrix.target }}/release/wisecortex-server.exe `
                           -DestinationPath dist/wisecortex-${{ matrix.label }}.zip

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          # Tauri 产物路径随平台不同，统一捞一遍。
          find target/${{ matrix.target }}/release/bundle -type f \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
