name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ⚠️ 这里的 @stable 不决定编译用哪个版本——版本锁在仓库根的 rust-toolchain.toml，
      # rustup 见到它会自动下载并覆盖默认工具链。要升级改那个文件，改这里没用。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 不含 desktop（Tauri 需 webkit 系统依赖，仅 mac/win 构建）。
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Run cargo test
        # 落一份日志：Actions 的 job 日志**必须登录**才能看（public 仓库也一样，
        # 匿名取 logs 端点一律 403），而 annotation / job summary 是公开可读的。
        # 失败时把摘要发到那两个通道，排查才不必先找一个有权限的人。
        #
        # ⚠️ 这里**不要**写 `shell: bash`。Linux 上默认（不下发 shell）是
        # `bash --noprofile --norc -e -o pipefail`，而显式 `shell: bash` 会被 runner
        # 映射成 `bash -e`（见 ScriptHandler：shell=="bash" 时取 "sh" 的参数表），
        # **丢掉 pipefail** —— 管道退出码就只看末端的 `tee`（恒为 0），
        # cargo test 失败会被静默放行。默认已带 pipefail，保持不写最安全。
        run: cargo test 2>&1 | tee /tmp/cargo-test.log
      - name: 失败时把测试摘要发成公开可读的 annotation
        if: failure()
        run: |
          hits() { grep -E "$1" /tmp/cargo-test.log || true; }
          {
            echo '## cargo test 失败摘要'
            echo '完整 job 日志需登录才能看，这里把关键行公开出来。'
            echo '```'
            hits 'FAILED|panicked at|assertion|test result:|^---- |left:|right:|got:|error\[' | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # annotation 有 10 条上限，故合成一条；换行要编成 %0A、% 先转义成 %25。
          line=$(hits 'FAILED|panicked at|assertion|test result:' \
            | head -40 | sed 's/%/%25/g' | tr -d '\r' | awk 'BEGIN{ORS="%0A"}1')
          echo "::error::cargo test 失败（完整日志需登录）: ${line:-未能从日志里抓到失败行}"

  # macOS：GUI 控制是平台专属代码，ubuntu 那个 job 根本编译不到 mac_gui
  # （#[cfg(target_os = "macos")] 整个模块被跳过）。没有这个 job，AX/CGEvent 的
  # 编译错误在真机跑之前不会有任何人发现——开发机是 Windows，也交叉编译不了。
  # 注意：这里只保证「编译得过」。运行时验不了：CI 授不了 Accessibility/录屏权限，
  # 也没有登录态 GUI 会话，相关 smoke 测试会自跳过。真机验证仍不可替代。
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # 同上：实际版本由 rust-toolchain.toml 决定。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 同样走 default-members（不含 desktop/Tauri）。
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx biome check .
      - run: npx tsc --noEmit
      - run: npx vitest run
